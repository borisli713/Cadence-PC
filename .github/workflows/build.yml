name: Build & Release Cadence Windows (Rust + Tauri)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "cadence-windows-release"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compute next semantic version (starts at 1.0.0, +0.0.1 per release)
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
        run: |
          git fetch --tags --force
          python -c @'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["REPO_FULL"]
          token = os.environ.get("GH_TOKEN", "")
          url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "cadence-release-workflow",
              },
          )

          win_versions = []
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              for rel in releases:
                  assets = rel.get("assets") or []
                  has_win_asset = any(
                      (a.get("name") or "").lower().endswith((".exe", ".msi"))
                      for a in assets
                  )
                  if not has_win_asset:
                      continue
                  tag = (rel.get("tag_name") or "").strip()
                  m = re.match(r"^(?:windows-v?|win-v?|v)?(\d+)\.(\d+)\.(\d+)$", tag, re.IGNORECASE)
                  if m:
                      win_versions.append(tuple(int(x) for x in m.groups()))
          except Exception as exc:
              print(f"Release lookup warning (starting at 1.0.0): {exc}")

          if not win_versions or max(win_versions) < (1, 0, 0):
              next_ver = "1.0.0"
          else:
              major, minor, patch = max(win_versions)
              next_ver = f"{major}.{minor}.{patch + 1}"

          tag_name = f"windows-v{next_ver}"

          # Patch package.json
          with open("package.json", "r", encoding="utf-8") as f:
              pkg = json.load(f)
          pkg["version"] = next_ver
          with open("package.json", "w", encoding="utf-8") as f:
              json.dump(pkg, f, indent=2)
              f.write("\n")

          # Patch src-tauri/tauri.conf.json
          with open("src-tauri/tauri.conf.json", "r", encoding="utf-8") as f:
              tauri_conf = json.load(f)
          tauri_conf["version"] = next_ver
          with open("src-tauri/tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(tauri_conf, f, indent=2)
              f.write("\n")

          # Patch src-tauri/Cargo.toml
          with open("src-tauri/Cargo.toml", "r", encoding="utf-8") as f:
              cargo_toml = f.read()
          cargo_toml = re.sub(
              r'(?m)^(version\s*=\s*")[^"]+(")',
              rf'\g<1>{next_ver}\g<2>',
              cargo_toml,
              count=1,
          )
          with open("src-tauri/Cargo.toml", "w", encoding="utf-8") as f:
              f.write(cargo_toml)

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write(f"version={next_ver}\n")
              f.write(f"tag_name={tag_name}\n")

          print(f"Computed next Windows release version: {next_ver} (tag {tag_name})")
          '@

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint and check frontend TypeScript build
        run: |
          npm run lint
          npm run build

      - name: Run Rust unit tests (Fairness Engine & ICS exporter)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Tauri application & installers
        run: npx tauri build

      - name: Collect Windows release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $portableExe = "src-tauri/target/release/cadence.exe"
          if (Test-Path $portableExe) {
            Copy-Item $portableExe "release-assets/Cadence-${env:TAG_NAME}-windows-x64-portable.exe"
          }

          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/Cadence-${env:TAG_NAME}-windows-x64-setup.exe"
          }

          Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/Cadence-${env:TAG_NAME}-windows-x64.msi"
          }

          Get-ChildItem -Path "release-assets"

      - name: Generate changelog for GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python -c @'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          current_tag = os.environ["CURRENT_TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO_FULL"]
          repo_url = os.environ["REPO_URL"]
          token = os.environ.get("GH_TOKEN", "")

          prev_win_tag = ""
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=50",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cadence-release-workflow",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              for rel in releases:
                  tag = (rel.get("tag_name") or "").strip()
                  assets = rel.get("assets") or []
                  has_win = any(
                      (a.get("name") or "").lower().endswith((".exe", ".msi"))
                      for a in assets
                  )
                  if has_win and tag and tag != current_tag:
                      prev_win_tag = tag
                      break
          except Exception:
              prev_win_tag = ""

          log_range = f"{prev_win_tag}..HEAD" if prev_win_tag else "HEAD~15..HEAD"
          try:
              raw = subprocess.check_output(
                  ["git", "log", log_range, "--no-merges", "--pretty=format:%s"],
                  text=True,
              ).strip()
          except Exception:
              raw = subprocess.check_output(
                  ["git", "log", "-n", "15", "--pretty=format:%s"],
                  text=True,
              ).strip()

          commits = [
              line.strip()
              for line in raw.splitlines()
              if line.strip() and not line.strip().lower().startswith(("merge ", "chore(release)"))
          ]
          if not commits:
              commits = ["Windows Rust + Tauri desktop build and maintenance updates."]

          lines = [
              f"## Cadence Windows Desktop v{version}",
              "",
              "### Downloads",
              f"- `Cadence-{current_tag}-windows-x64-setup.exe` — Windows NSIS Installer",
              f"- `Cadence-{current_tag}-windows-x64.msi` — Windows MSI Package",
              f"- `Cadence-{current_tag}-windows-x64-portable.exe` — Portable Windows Executable",
              "",
              "### What's Changed",
              "",
          ]
          for c in commits[:30]:
              lines.append(f"- {c}")

          if prev_win_tag:
              lines.append("")
              lines.append(f"**Full Changelog**: {repo_url}/compare/{prev_win_tag}...{current_tag}")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          '@

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Cadence Windows v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
