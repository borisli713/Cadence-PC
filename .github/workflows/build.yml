name: Build & Release Cadence Windows (Rust + Tauri)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "cadence-windows-release"
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compute next semantic version (starts at 1.0.0, +0.0.1 per release)
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
        run: |
          git fetch --tags --force
          python -c @'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          repo = os.environ["REPO_FULL"]
          token = os.environ.get("GH_TOKEN", "")
          url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "cadence-release-workflow",
              },
          )

          win_versions = []
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              for rel in releases:
                  assets = rel.get("assets") or []
                  has_win_asset = any(
                      (a.get("name") or "").lower().endswith((".exe", ".msi"))
                      for a in assets
                  )
                  if not has_win_asset:
                      continue
                  tag = (rel.get("tag_name") or "").strip()
                  m = re.match(r"^(?:windows-v?|win-v?|v)?(\d+)\.(\d+)\.(\d+)$", tag, re.IGNORECASE)
                  if m:
                      win_versions.append(tuple(int(x) for x in m.groups()))
          except Exception as exc:
              print(f"Release lookup warning (starting at 1.0.0): {exc}")

          with open("package.json", "r", encoding="utf-8") as f:
              pkg = json.load(f)

          floor_match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", str(pkg.get("version", "1.0.0")).strip())
          floor_ver = tuple(int(x) for x in floor_match.groups()) if floor_match else (1, 0, 0)

          if not win_versions or max(win_versions) < floor_ver:
              next_ver = ".".join(str(x) for x in floor_ver)
          else:
              major, minor, patch = max(win_versions)
              next_ver = f"{major}.{minor}.{patch + 1}"

          tag_name = f"windows-v{next_ver}"

          # Patch package.json
          pkg["version"] = next_ver
          with open("package.json", "w", encoding="utf-8") as f:
              json.dump(pkg, f, indent=2)
              f.write("\n")

          # Patch src-tauri/tauri.conf.json
          with open("src-tauri/tauri.conf.json", "r", encoding="utf-8") as f:
              tauri_conf = json.load(f)
          tauri_conf["version"] = next_ver
          with open("src-tauri/tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(tauri_conf, f, indent=2)
              f.write("\n")

          # Patch src-tauri/Cargo.toml
          with open("src-tauri/Cargo.toml", "r", encoding="utf-8") as f:
              cargo_toml = f.read()
          cargo_toml = re.sub(
              r'(?m)^(version\s*=\s*")[^"]+(")',
              rf'\g<1>{next_ver}\g<2>',
              cargo_toml,
              count=1,
          )
          with open("src-tauri/Cargo.toml", "w", encoding="utf-8") as f:
              f.write(cargo_toml)

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write(f"version={next_ver}\n")
              f.write(f"tag_name={tag_name}\n")

          print(f"Computed next Windows release version: {next_ver} (tag {tag_name})")
          '@

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint and check frontend TypeScript build
        run: |
          npm run lint
          npm run build

      - name: Run Rust unit tests (Fairness Engine & ICS exporter)
        env:
          CADENCE_GITHUB_REPO: ${{ github.repository }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          CADENCE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.CADENCE_GOOGLE_DESKTOP_CLIENT_ID }}
          CADENCE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CADENCE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Tauri application & installers
        env:
          CADENCE_GITHUB_REPO: ${{ github.repository }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          CADENCE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.CADENCE_GOOGLE_DESKTOP_CLIENT_ID }}
          CADENCE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CADENCE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npx tauri build

      - name: Collect Windows release assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $portableExe = "src-tauri/target/release/cadence.exe"
          if (Test-Path $portableExe) {
            Copy-Item $portableExe "release-assets/Cadence-${env:TAG_NAME}-windows-x64-portable.exe"
          }

          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/Cadence-${env:TAG_NAME}-windows-x64-setup.exe"
          }

          Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "release-assets/Cadence-${env:TAG_NAME}-windows-x64.msi"
          }

          Get-ChildItem -Path "release-assets"

      - name: Generate changelog for GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.version.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python -c @'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          current_tag = os.environ["CURRENT_TAG"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO_FULL"]
          repo_url = os.environ["REPO_URL"]
          token = os.environ.get("GH_TOKEN", "")

          prev_win_tag = ""
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=50",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cadence-release-workflow",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              win_tags = []
              for rel in releases:
                  tag = (rel.get("tag_name") or "").strip()
                  assets = rel.get("assets") or []
                  has_win = any(
                      (a.get("name") or "").lower().endswith((".exe", ".msi"))
                      for a in assets
                  )
                  m = re.match(r"^(?:windows-v?|win-v?|v)?(\d+)\.(\d+)\.(\d+)$", tag, re.IGNORECASE)
                  if has_win and m and tag != current_tag:
                      win_tags.append((tuple(int(x) for x in m.groups()), tag))
              if win_tags:
                  prev_win_tag = max(win_tags, key=lambda item: item[0])[1]
          except Exception:
              prev_win_tag = ""

          log_range = f"{prev_win_tag}..HEAD" if prev_win_tag else "HEAD~15..HEAD"
          try:
              raw = subprocess.check_output(
                  ["git", "log", log_range, "--no-merges", "--pretty=format:%s"],
                  text=True,
              ).strip()
          except Exception:
              raw = subprocess.check_output(
                  ["git", "log", "-n", "15", "--pretty=format:%s"],
                  text=True,
              ).strip()

          commits = [
              line.strip()
              for line in raw.splitlines()
              if line.strip() and not line.strip().lower().startswith(("merge ", "chore(release)"))
          ]
          if not commits:
              commits = ["Windows Rust + Tauri desktop build and maintenance updates."]

          lines = [
              f"## Cadence Windows Desktop v{version}",
              "",
              "### Downloads",
              f"- `Cadence-{current_tag}-windows-x64-setup.exe` — Windows NSIS Installer",
              f"- `Cadence-{current_tag}-windows-x64.msi` — Windows MSI Package",
              f"- `Cadence-{current_tag}-windows-x64-portable.exe` — Portable Windows Executable",
              "",
              "### What's Changed",
              "",
          ]
          for c in commits[:30]:
              lines.append(f"- {c}")

          if prev_win_tag:
              lines.append("")
              lines.append(f"**Full Changelog**: {repo_url}/compare/{prev_win_tag}...{current_tag}")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          '@

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Cadence Windows v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true

      - name: Upload Windows release bundle for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: cadence-windows-assets
          path: |
            release-assets/*
            release_notes.md
          retention-days: 1

  stage-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: cadence-windows-assets
          path: current-release-assets

      - name: Stage GitHub Pages site, installers, and releases manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          CURRENT_TAG: ${{ needs.build-and-release.outputs.tag_name }}
          CURRENT_VERSION: ${{ needs.build-and-release.outputs.version }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import shutil
          import urllib.request

          repo = os.environ["REPO_FULL"]
          repo_url = os.environ["REPO_URL"]
          token = os.environ.get("GH_TOKEN", "")
          current_tag = os.environ["CURRENT_TAG"]
          current_ver = os.environ["CURRENT_VERSION"]

          site_dir = "_site"
          if os.path.exists(site_dir):
              shutil.rmtree(site_dir)
          shutil.copytree("docs", site_dir)

          downloads_root = os.path.join(site_dir, "downloads")
          os.makedirs(downloads_root, exist_ok=True)

          def parse_ver(tag):
              m = re.match(r"^(?:windows-v?|win-v?|v)?(\d+)\.(\d+)\.(\d+)$", (tag or "").strip(), re.I)
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)

          def classify_asset(name):
              low = name.lower()
              if low.endswith("-setup.exe"):
                  return ("setup", "Windows Installer (.exe)")
              if low.endswith(".msi"):
                  return ("msi", "MSI Package (.msi)")
              if low.endswith("-portable.exe"):
                  return ("portable", "Portable App (.exe)")
              if low.endswith(".exe"):
                  return ("exe", "Windows Executable (.exe)")
              return ("other", name)

          def download_file(url, dest_path):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cadence-pages-packager",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as resp, open(dest_path, "wb") as out:
                  shutil.copyfileobj(resp, out)

          # 1. Fetch existing published Windows releases from GitHub API
          api_releases = []
          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=50",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cadence-pages-packager",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  api_releases = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"Warning fetching releases API: {exc}")

          releases_by_tag = {}
          for rel in api_releases:
              if rel.get("draft") or rel.get("prerelease"):
                  continue
              tag = (rel.get("tag_name") or "").strip()
              assets = []
              for a in rel.get("assets") or []:
                  name = a.get("name") or ""
                  if not name.lower().endswith((".exe", ".msi")):
                      continue
                  kind, label = classify_asset(name)
                  assets.append({
                      "name": name,
                      "kind": kind,
                      "label": label,
                      "sizeBytes": a.get("size", 0),
                      "url": a.get("browser_download_url"),
                      "githubUrl": a.get("browser_download_url"),
                  })
              if not assets:
                  continue
              ver_tuple = parse_ver(tag)
              ver_str = ".".join(str(x) for x in ver_tuple) if ver_tuple != (0, 0, 0) else tag
              releases_by_tag[tag] = {
                  "tagName": tag,
                  "version": ver_str,
                  "name": rel.get("name") or f"Cadence Windows v{ver_str}",
                  "publishedAt": rel.get("published_at") or "",
                  "body": rel.get("body") or "",
                  "releasePageUrl": rel.get("html_url") or f"{repo_url}/releases/tag/{tag}",
                  "assets": assets,
              }

          # 2. Ensure the just-built release is authoritative using uploaded artifacts
          notes_path = os.path.join("current-release-assets", "release_notes.md")
          current_notes = ""
          if os.path.exists(notes_path):
              with open(notes_path, "r", encoding="utf-8") as nf:
                  current_notes = nf.read()

          current_tag_dir = os.path.join(downloads_root, current_tag)
          os.makedirs(current_tag_dir, exist_ok=True)
          current_assets = []
          for entry in sorted(os.listdir("current-release-assets")):
              if not entry.lower().endswith((".exe", ".msi")):
                  continue
              src_path = os.path.join("current-release-assets", entry)
              dest_path = os.path.join(current_tag_dir, entry)
              shutil.copy2(src_path, dest_path)
              kind, label = classify_asset(entry)
              gh_url = f"{repo_url}/releases/download/{current_tag}/{entry}"
              current_assets.append({
                  "name": entry,
                  "kind": kind,
                  "label": label,
                  "sizeBytes": os.path.getsize(dest_path),
                  "url": f"./downloads/{current_tag}/{entry}",
                  "githubUrl": gh_url,
              })

          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          if current_assets:
              existing_cur = releases_by_tag.get(current_tag, {})
              releases_by_tag[current_tag] = {
                  "tagName": current_tag,
                  "version": current_ver,
                  "name": f"Cadence Windows v{current_ver}",
                  "publishedAt": existing_cur.get("publishedAt") or now_iso,
                  "body": current_notes or existing_cur.get("body") or "",
                  "releasePageUrl": f"{repo_url}/releases/tag/{current_tag}",
                  "assets": current_assets,
              }

          # 3. Order newest first and mirror past installers onto GitHub Pages within 650 MB budget
          ordered = sorted(releases_by_tag.values(), key=lambda r: parse_ver(r["tagName"]), reverse=True)
          kind_order = {"setup": 0, "msi": 1, "portable": 2, "exe": 3, "other": 4}
          total_hosted_bytes = sum(a.get("sizeBytes", 0) for a in current_assets)
          max_hosted_bytes = 650 * 1024 * 1024

          for idx, rel in enumerate(ordered):
              rel["isLatest"] = (idx == 0)
              tag = rel["tagName"]
              tag_dir = os.path.join(downloads_root, tag)
              if tag != current_tag:
                  os.makedirs(tag_dir, exist_ok=True)
                  for asset in rel["assets"]:
                      size = asset.get("sizeBytes", 0)
                      dest_path = os.path.join(tag_dir, asset["name"])
                      if total_hosted_bytes + size <= max_hosted_bytes and asset.get("githubUrl"):
                          try:
                              download_file(asset["githubUrl"], dest_path)
                              total_hosted_bytes += os.path.getsize(dest_path)
                              asset["url"] = f"./downloads/{tag}/{asset['name']}"
                          except Exception as exc:
                              print(f"Mirror fallback to GitHub URL for {tag}/{asset['name']}: {exc}")
              rel["assets"].sort(key=lambda a: kind_order.get(a.get("kind"), 9))

          manifest = {
              "repository": repo,
              "generatedAt": now_iso,
              "latestVersion": ordered[0]["version"] if ordered else current_ver,
              "releases": ordered,
          }
          with open(os.path.join(site_dir, "releases.json"), "w", encoding="utf-8") as mf:
              json.dump(manifest, mf, indent=2)
              mf.write("\n")

          print(f"Staged {len(ordered)} releases into {site_dir}; hosted binaries={total_hosted_bytes / (1024 * 1024):.1f} MB")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify staged Pages directory
        run: |
          du -sh _site
          ls -la _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy-pages:
    needs: stage-pages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for GitHub Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPO_FULL"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name=github-pages"

          for attempt in range(1, 16):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cadence-pages-verifier",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  artifacts = [
                      a for a in (payload.get("artifacts") or [])
                      if a.get("name") == "github-pages" and not a.get("expired")
                  ]
                  if artifacts:
                      print(f"Verified github-pages artifact id={artifacts[0].get('id')} size={artifacts[0].get('size_in_bytes')} on attempt {attempt}")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print(f"Artifact metadata check attempt {attempt} warning: {exc}")
              time.sleep(2)

          raise SystemExit("Timed out waiting for github-pages artifact metadata to become visible via GitHub API.")
          PY

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

